<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Ionic theme parity</title>
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <ion-app
      ><ion-tabs
        ><ion-tab tab="home"
          ><div class="ion-page">
            <ion-header translucent="true"
              ><ion-toolbar
                ><ion-title>Ionic theme parity</ion-title
                ><ion-buttons slot="end"><ion-button id="add" aria-label="Add">Add</ion-button></ion-buttons></ion-toolbar
              ><ion-toolbar
                ><ion-segment id="segment" value="one"
                  ><ion-segment-button value="one"><ion-label>One</ion-label></ion-segment-button
                  ><ion-segment-button value="two"><ion-label>Two</ion-label></ion-segment-button></ion-segment
                ></ion-toolbar
              ></ion-header
            >
            <ion-content color="light"
              ><ion-list inset="true"
                ><ion-item-group
                  ><ion-item
                    ><ion-label
                      ><h2>Theme styled list</h2>
                      <p id="count">Count: 0</p></ion-label
                    ></ion-item
                  ><ion-item><ion-label id="selection">Segment: one</ion-label></ion-item
                  ><ion-item><ion-label id="query">Query: empty</ion-label></ion-item></ion-item-group
                ></ion-list
              >
              <div class="actions">
                <ion-button id="modal">Open modal</ion-button><ion-button id="popover">Open popover</ion-button
                ><ion-button id="transition">Transition handshake</ion-button><ion-button id="dark">Toggle dark</ion-button
                ><ion-button id="stop">Stop native UI</ion-button><ion-button id="restart">Restart native UI</ion-button>
                <p id="status">Waiting</p>
                <p id="integration"></p>
                <p id="transition-result"></p>
                <p id="overlay-result"></p>
              </div>
              <ion-fab vertical="bottom" horizontal="end" slot="fixed"
                ><ion-fab-button id="search-trigger" aria-label="Search"><ion-icon data-icon="search"></ion-icon></ion-fab-button></ion-fab
            ></ion-content>
            <ion-footer id="search-footer" translucent="true"
              ><ion-toolbar
                ><ion-buttons slot="start"
                  ><ion-button id="close-search" aria-label="Close search"><ion-icon slot="icon-only"></ion-icon></ion-button></ion-buttons
                ><ion-searchbar id="search" placeholder="Find items"></ion-searchbar></ion-toolbar
            ></ion-footer>
          </div> </ion-tab
        ><ion-tab tab="settings"
          ><div class="ion-page">
            <ion-header
              ><ion-toolbar><ion-title>Settings panel</ion-title></ion-toolbar></ion-header
            ><ion-content><p>Settings content</p></ion-content>
          </div></ion-tab
        >
        <ion-tab-bar slot="bottom" id="tabs"
          ><ion-tab-button tab="home" selected="true"><ion-icon data-icon="home"></ion-icon><ion-label>Home</ion-label></ion-tab-button
          ><ion-tab-button tab="settings"
            ><ion-icon data-icon="settings"></ion-icon><ion-label>Settings</ion-label></ion-tab-button
          ></ion-tab-bar
        ></ion-tabs
      ></ion-app
    >
    <script src="HOST.js"></script>
    <script src="main.js"></script>
  </body>
</html>
