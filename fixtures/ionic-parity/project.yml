name: IonicParityTests
options:
  deploymentTarget:
    iOS: '26.0'
targets:
  IonicParityTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [IonicParityTests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.rdlabo.nativeui.ionicparity.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  IonicParityTests:
    build:
      targets:
        IonicParityTests: [test]
    test:
      targets: [IonicParityTests]
