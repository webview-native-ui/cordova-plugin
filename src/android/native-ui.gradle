// Cordova applies this as an external Gradle script. Configure the Kotlin compiler
// directly so Compose and Kotlin share the application's compiler classloader.
dependencies {
    kotlinCompilerPluginClasspath 'org.jetbrains.kotlin:kotlin-compose-compiler-plugin-embeddable:2.2.20'
    implementation 'io.github.webview-native-ui:engine:[1.0.0,2.0.0)'
    implementation platform('androidx.compose:compose-bom:2025.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
